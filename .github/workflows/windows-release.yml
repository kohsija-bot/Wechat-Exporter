name: Windows portable release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - name: Install dependencies
        run: python -m pip install -r requirements.txt 'pyinstaller>=6.16,<7'
      - name: Run tests
        run: python -m unittest discover -v
      - name: Build portable application
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name WeChatExporter --hidden-import wx4.key --hidden-import wx4.decrypt
          --hidden-import wx4.paths --hidden-import wx4.offline_image
          --hidden-import PySide6.QtMultimedia --hidden-import PySide6.QtMultimediaWidgets main.py
      - name: Smoke-test frozen application
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $p = Start-Process -FilePath 'dist/WeChatExporter/WeChatExporter.exe' -ArgumentList '--smoke-test' -PassThru
          if (-not $p.WaitForExit(45000)) { $p.Kill(); throw 'Startup smoke test timed out' }
          if ($p.ExitCode -ne 0) { throw "Startup smoke test failed: $($p.ExitCode)" }
      - name: Package release
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '2.1.0-beta' }
          $app = 'dist/WeChatExporter'
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item LICENSE,README.md,README.txt,README-MEDIA.txt,MOECT-THIRD-PARTY-NOTICES.md,RELEASE-NOTES.md -Destination $app
          Copy-Item demo_archive -Destination $app -Recurse
          python scripts/collect_licenses.py "$app/THIRD_PARTY_LICENSES"
          if ($LASTEXITCODE -ne 0) { throw 'License collection failed' }
          git archive --format=zip --prefix=WeChatExporter/ --output="release/WeChatExporter-$version-Source.zip" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source archive failed' }
          Compress-Archive -Path $app -DestinationPath "release/WeChatExporter-$version-Windows-x64.zip"
          Get-ChildItem release/*.zip | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content -Encoding ascii release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WeChatExporter-Windows-x64
          path: release/*
      - name: Publish GitHub prerelease
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem release -File | ForEach-Object { $_.FullName })
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --prerelease --title "WeChat Exporter $env:GITHUB_REF_NAME" --notes-file RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }
